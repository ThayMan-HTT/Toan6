<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập Toán 6</title>
<style>
:root{--nen:#f3f5fa;--the:#fff;--chu:#17202e;--nhat:#5b6475;--xanh:#0a4f5c;--xanh2:#e3f1f3;--dung:#156b2e;--dung2:#e4f4e8;--sai:#b41c1c;--sai2:#fdecea;--cam:#c2410c;--cam2:#fff1e6;--vang:#fff6d6;--vien:#d5dce6}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu);font:17px/1.55 "Times New Roman",Georgia,serif}
header{background:var(--xanh);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:13px;opacity:.9;font-family:Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px 16px 96px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:18px;color:var(--xanh);margin:18px 0 8px}
label,.nho{font-size:14px;color:var(--nhat);font-family:Arial,sans-serif}
input[type=text]{width:100%;font-size:18px;padding:10px 12px;border:1.5px solid var(--vien);border-radius:10px;margin:4px 0 8px;font-family:inherit}
input:focus{outline:2px solid var(--xanh);border-color:var(--xanh)}
button{font:inherit;font-size:16px;cursor:pointer;border-radius:10px;border:1.5px solid var(--vien);background:#fff;padding:10px 14px;color:var(--chu)}
.chinh{background:var(--xanh);color:#fff;border-color:var(--xanh);font-weight:700}
.bai{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.bai b{display:block}.bai small{color:var(--nhat)}
.diem{font-weight:700;color:var(--xanh);white-space:nowrap;font-family:Arial,sans-serif;font-size:14px}
.nhan{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--xanh2);color:var(--xanh);margin-right:6px;font-family:Arial,sans-serif}
.de{font-size:18px;margin:4px 0 10px}
.y{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--vien)}
.y div{flex:1}.y button{min-width:58px;padding:8px}
.y button.chon{background:var(--xanh);color:#fff;border-color:var(--xanh)}
.chk{display:flex;gap:8px;align-items:flex-start;background:var(--vang);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:15px}
.chk input{width:22px;height:22px;margin-top:2px}
.dieuhuong{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--vien);padding:10px 16px;display:flex;gap:8px;justify-content:center;z-index:5}
.dieuhuong button{flex:1;max-width:260px}
.kq-diem{font-size:48px;font-weight:800;color:var(--xanh);text-align:center;margin:0;font-family:Arial,sans-serif}
.muc{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;font-family:Arial,sans-serif}
.muc div{background:var(--nen);border-radius:8px;padding:6px 10px}
.kq{border-left:6px solid var(--vien)}.kq.d{border-left-color:var(--dung)}.kq.s{border-left-color:var(--sai)}.kq.m{border-left-color:var(--cam)}
.tag{font-weight:700;font-family:Arial,sans-serif;font-size:14px}.d .tag{color:var(--dung)}.s .tag{color:var(--sai)}.m .tag{color:var(--cam)}
.nhac{background:var(--sai2);border-radius:10px;padding:8px 12px;margin-top:8px}
.nhac b{color:var(--sai)}
.giai{background:var(--dung2);border-radius:10px;padding:8px 12px;margin-top:8px}
.giai table{width:100%;border-collapse:collapse}.giai td{padding:3px 4px;vertical-align:top;border-bottom:1px dotted #b9d8c1}
.giai td:last-child{width:52px;text-align:right;color:var(--dung);font-weight:700;font-family:Arial,sans-serif;font-size:14px;white-space:nowrap}
.yk{font-size:15px;padding:3px 0}
details summary{cursor:pointer;color:var(--xanh);font-weight:700;margin-top:8px;font-family:Arial,sans-serif;font-size:15px}
.ov{text-decoration:overline}
.hang{display:flex;gap:8px;flex-wrap:wrap}.hang button{flex:1;min-width:150px}
table.ls{width:100%;border-collapse:collapse;font-size:14px;font-family:Arial,sans-serif}table.ls td,table.ls th{border-bottom:1px solid var(--vien);padding:5px;text-align:left}
.an{display:none}
.buoc{counter-reset:b;padding-left:0;list-style:none;margin:6px 0 0}
.buoc li{counter-increment:b;position:relative;padding-left:30px;margin:4px 0;font-size:16px}
.buoc li:before{content:counter(b);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--xanh);color:#fff;font:700 13px/22px Arial;text-align:center}
</style></head><body>
<header><h1>Ôn tập Toán 6</h1><p>THCS Hoàng Tá Thốn · thầy Vũ Văn Mận</p></header>
<main id="app"></main>
<div class="dieuhuong an" id="dh"></div>
<script>
const DATA = [{"so": 1, "loai": "vn", "ten": "Tập hợp. Các phép tính trong tập hợp số tự nhiên", "phut": 45, "ds": [{"de": "Cho M = {x ∈ ℕ | 15 ≤ x < 21}. Mỗi khẳng định sau đúng hay sai?", "y": [["M = {15; 16; 17; 18; 19; 20}", true, "x ≥ 15 và x < 21"], ["21 ∈ M", false, "x < 21 nên 21 ∉ M"], ["M có 6 phần tử", true, "20 − 15 + 1 = 6"], ["15 ∉ M", false, "x ≥ 15 nên 15 ∈ M"]]}, {"de": "Mỗi khẳng định sau đúng hay sai?", "y": [["Số La Mã XIX có giá trị là 19", true, "X + IX = 10 + 9"], ["Số tự nhiên nhỏ nhất có ba chữ số khác nhau là 102", true, "chữ số trăm nhỏ nhất là 1, rồi 0, rồi 2"], ["Trong phép chia cho 7, số dư lớn nhất là 7", false, "số dư luôn nhỏ hơn số chia, lớn nhất là 6"], ["50 · 13 · 2 = 1 300", true, "(50 · 2) · 13 = 100 · 13"]]}], "tl": [{"bai": 1, "nhan": "a", "muc": "Biết", "chung": "", "de": "Viết tập hợp D các số tự nhiên chẵn lớn hơn 10 và không vượt quá 20 bằng cách liệt kê các phần tử.", "diem": 1.0, "loai": "tap", "dap": [12, 14, 16, 18, 20], "hoi": "Nhập các phần tử của D", "dv": "", "giai": [["Các số chẵn lớn hơn 10 và nhỏ hơn hoặc bằng 20 là 12; 14; 16; 18; 20.", 0.5], ["D = {12; 14; 16; 18; 20}.", 0.5]], "loi": "Lấy cả 10, hoặc bỏ sót 20 («không vượt quá 20» nghĩa là được bằng 20).", "tu": "", "tu_diem": 0}, {"bai": 1, "nhan": "b", "muc": "Biết", "chung": "", "de": "Tính nhanh: 4 · 37 · 25", "diem": 1.0, "loai": "so", "dap": 3700, "hoi": "Kết quả", "dv": "", "giai": [["4 · 37 · 25 = (4 · 25) · 37", 0.5], ["= 100 · 37 = 3 700.", 0.5]], "loi": "Nhân lần lượt từ trái sang dễ sai; ghép 4 · 25 = 100 trước.", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "a", "muc": "Hiểu", "chung": "", "de": "Tính hợp lí: 47 · 36 + 47 · 64 − 700", "diem": 1.0, "loai": "so", "dap": 4000, "hoi": "Kết quả", "dv": "", "giai": [["47 · 36 + 47 · 64 − 700 = 47 · (36 + 64) − 700", 0.5], ["= 4 700 − 700 = 4 000.", 0.5]], "loi": "Đặt thừa số chung rồi quên trừ 700.", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "b", "muc": "Hiểu", "chung": "", "de": "Tìm số tự nhiên x, biết: 3 · (x − 5) + 14 = 50", "diem": 1.0, "loai": "so", "dap": 17, "hoi": "x =", "dv": "", "giai": [["3 · (x − 5) = 50 − 14 = 36", 0.25], ["x − 5 = 36 : 3 = 12", 0.25], ["x = 12 + 5 = 17.", 0.25], ["Vậy x = 17.", 0.25]], "loi": "Lấy 50 + 14 (phải trừ: số hạng chưa biết = tổng − số hạng đã biết).", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "c", "muc": "Hiểu", "chung": "", "de": "Tính số phần tử của tập hợp E = {12; 18; 24; …; 120}.", "diem": 1.0, "loai": "so", "dap": 19, "hoi": "Số phần tử", "dv": "", "giai": [["Các số cách đều nhau 6 đơn vị.", 0.25], ["Số phần tử: (120 − 12) : 6 + 1", 0.5], ["= 18 + 1 = 19.", 0.25]], "loi": "Quên «+ 1» nên ra 18.", "tu": "", "tu_diem": 0}, {"bai": 3, "nhan": "a", "muc": "Vận dụng", "chung": "Lớp 6A mua 12 quyển truyện giá 45 000 đồng/quyển và 8 hộp bút giá 27 000 đồng/hộp. Lớp đưa cô bán hàng 1 000 000 đồng.", "de": "Lớp phải trả tất cả bao nhiêu tiền?", "diem": 1.0, "loai": "so", "dap": 756000, "hoi": "Số tiền (đồng)", "dv": "đồng", "giai": [["Tiền truyện: 12 · 45 000 = 540 000 (đồng).", 0.25], ["Tiền bút: 8 · 27 000 = 216 000 (đồng).", 0.25], ["Tổng tiền: 540 000 + 216 000 = 756 000 (đồng).", 0.5]], "loi": "Quên nhân số lượng với đơn giá.", "tu": "", "tu_diem": 0}, {"bai": 3, "nhan": "b", "muc": "Vận dụng", "chung": "Lớp 6A mua 12 quyển truyện giá 45 000 đồng/quyển và 8 hộp bút giá 27 000 đồng/hộp. Lớp đưa cô bán hàng 1 000 000 đồng.", "de": "Với số tiền được trả lại, lớp muốn mua thêm 6 quyển sổ, mỗi quyển 42 000 đồng. Lớp có đủ tiền không? Nếu không đủ thì còn thiếu bao nhiêu?", "diem": 1.0, "loai": "so", "dap": 8000, "hoi": "Số tiền còn thiếu (đồng)", "dv": "đồng", "giai": [["Tiền được trả lại: 1 000 000 − 756 000 = 244 000 (đồng).", 0.25], ["Tiền 6 quyển sổ: 6 · 42 000 = 252 000 (đồng).", 0.25], ["Vì 244 000 < 252 000 nên lớp không đủ tiền,", 0.25], ["còn thiếu 252 000 − 244 000 = 8 000 (đồng).", 0.25]], "loi": "Kết luận «đủ» mà không so sánh; hoặc chỉ tính một quyển sổ.", "tu": "", "tu_diem": 0}, {"bai": 4, "nhan": "", "muc": "Vận dụng cao", "chung": "", "de": "Để đánh số trang một cuốn sách từ trang 1 đến trang 256, người ta cần dùng bao nhiêu chữ số?", "diem": 1.0, "loai": "so", "dap": 660, "hoi": "Số chữ số", "dv": "chữ số", "giai": [["Trang 1 đến 9 dùng 9 chữ số; trang 10 đến 99 dùng 90 · 2 = 180 (chữ số).", 0.25], ["Trang 100 đến 256 có 256 − 100 + 1 = 157 (trang).", 0.25], ["Các trang này dùng 157 · 3 = 471 (chữ số).", 0.25], ["Cần tất cả 9 + 180 + 471 = 660 (chữ số).", 0.25]], "loi": "Tính 256 · 3 cho mọi trang; hoặc đếm 256 − 100 = 156 trang (quên + 1).", "tu": "", "tu_diem": 0}]}, {"so": 2, "loai": "vn", "ten": "Luỹ thừa với số mũ tự nhiên. Thứ tự thực hiện phép tính", "phut": 45, "ds": [{"de": "Mỗi khẳng định sau đúng hay sai?", "y": [["3^{3} = 27", true, "3 · 3 · 3 = 27"], ["2^{5} = 10", false, "2^{5} = 32, không phải 2 · 5"], ["1^{10} = 1", true, "1 nhân với 1 bao nhiêu lần vẫn bằng 1"], ["10^{4} = 10 000", true, "1 và 4 chữ số 0"]]}, {"de": "Mỗi khẳng định sau đúng hay sai?", "y": [["5^{3} · 5^{2} = 5^{5}", true, "cộng số mũ"], ["2^{10} : 2^{5} = 2^{2}", false, "2^{10 − 5} = 2^{5}"], ["3^{2} · 3^{4} = 9^{6}", false, "= 3^{6}, giữ nguyên cơ số"], ["4^{0} = 0", false, "a^{0} = 1 với a ≠ 0"]]}], "tl": [{"bai": 1, "nhan": "a", "muc": "Biết", "chung": "", "de": "Viết tích 5 · 5 · 5 dưới dạng luỹ thừa rồi tính giá trị.", "diem": 1.0, "loai": "so", "dap": 125, "hoi": "Giá trị", "dv": "", "giai": [["5 · 5 · 5 = 5^{3}", 0.5], ["= 125.", 0.5]], "loi": "Viết 3^{5} (nhầm cơ số, số mũ) hoặc tính 5 · 3 = 15.", "tu": "", "tu_diem": 0}, {"bai": 1, "nhan": "b", "muc": "Biết", "chung": "", "de": "Viết kết quả dưới dạng một luỹ thừa: 3^{6} · 3^{2} : 3^{5}", "diem": 1.0, "loai": "so", "dap": 3, "hoi": "Kết quả có dạng 3^{n}, nhập số mũ n", "dv": "", "giai": [["3^{6} · 3^{2} : 3^{5} = 3^{8} : 3^{5}", 0.5], ["= 3^{3}.", 0.5]], "loi": "Nhân số mũ 6 · 2 thay vì cộng.", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "a", "muc": "Hiểu", "chung": "", "de": "Tính: 6 · 2^{3} − 2 · 3^{2}", "diem": 1.0, " 2} + … + 2^{9} + 2^{10}.", 0.25], ["2A − A = 2^{10} − 1, tức A = 1 024 − 1 = 1 023.", 0.5], ["Vậy A = 1 023.", 0.25]], "loi": "Quên trừ 1, hoặc bỏ sót số hạng 1 ở đầu tổng.", "tu": "", "tu_diem": 0}]}, {"so": 3, "loai": "vn", "ten": "Tính chia hết. Số nguyên tố. Ước chung, bội chung", "phut": 45, "ds": [{"de": "Cho các số 12; 18; 35; 45. Mỗi khẳng định sau đúng hay sai?", "y": [["Có đúng hai số chia hết cho 5", true, "chỉ có 35 và 45"], ["Các số đã cho đều chia hết cho 3", false, "35 có tổng chữ số là 8, không chia hết cho 3"], ["Có đúng hai số chia hết cho 9", true, "chỉ có 18 và 45"], ["Trong các số đã cho có một số nguyên tố", false, "các số đều có ước khác 1 và chính nó"]]}, {"de": "Mỗi khẳng định sau đúng hay sai?", "y": [["Số 0 là bội của mọi số tự nhiên khác 0", true, "0 chia hết cho mọi số khác 0"], ["Mọi số nguyên tố đều là số lẻ", false, "2 là số nguyên tố chẵn"], ["60 = 2^{2} · 3 · 5", true, "4 · 3 · 5 = 60"], ["B(6) = {6; 12; 18; 24}", false, "B(6) = {0; 6; 12; 18; 24; …} có vô số phần tử"]]}], "tl": [{"bai": 1, "nhan": "a", "muc": "Biết", "chung": "", "de": "Tìm Ư(20).", "diem": 1.0, "loai": "tap", "dap": [1, 2, 4, 5, 10, 20], "hoi": "Nhập các phần tử của Ư(20)", "dv": "", "giai": [["20 chia hết cho 1; 2; 4; 5; 10; 20.", 0.5], ["Ư(20) = {1; 2; 4; 5; 10; 20}.", 0.5]], "loi": "Quên ước 1, ước 4 hoặc chính nó (20).", "tu": "", "tu_diem": 0}, {"bai": 1, "nhan": "b", "muc": "Biết", "chung": "", "de": "Trong các số 2 340;  1 575;  4 122;  3 105, số nào chia hết cho cả 2, 3, 5 và 9?", "diem": 1.0, "loai": "so", "dap": 2340, "hoi": "Số đó là", "dv": "", "giai": [["Chia hết cho cả 2 và 5 thì tận cùng là 0: chỉ có 2 340.", 0.5], ["2 + 3 + 4 + 0 = 9 chia hết cho 9 (nên chia hết cho 3).", 0.25], ["Vậy số cần tìm là 2 340.", 0.25]], "loi": "Chọn 1 575 hoặc 3 105 (chia hết cho 5 và 9 nhưng là số lẻ).", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "a", "muc": "Hiểu", "chung": "", "de": "Phân tích số 252 ra thừa số nguyên tố.", "diem": 1.0, "loai": "tap", "dap": [2, 3, c", "muc": "Hiểu", "chung": "", "de": "Bể chứa nước bằng 3/4 bể thì có 180 lít. Bể đầy chứa bao nhiêu lít?", "diem": 1.0, "loai": "so", "dap": 240, "hoi": "Số lít", "dv": "", "giai": [["Bể đầy chứa 180 : 3/4 = 180 · 4/3", 0.5], ["= 240 (lít).", 0.5]], "loi": "Lấy 180 · 3/4 = 135.", "tu": "", "tu_diem": 0}, {"bai": 3, "nhan": "a", "muc": "Vận dụng", "chung": "Cửa hàng có 360 kg đường. Ngày đầu bán 2/9 số đường, ngày thứ hai bán 3/7 số đường còn lại.", "de": "Ngày đầu cửa hàng bán bao nhiêu kg đường?", "diem": 1.0, "loai": "so", "dap": 80, "hoi": "Số kg", "dv": "", "giai": [["Ngày đầu bán 360 · 2/9", 0.5], ["= 80 (kg).", 0.5]], "loi": "Lấy 360 : 2/9 = 1 620.", "tu": "", "tu_diem": 0}, {"bai": 3, "nhan": "b", "muc": "Vận dụng", "chung": "Cửa hàng có 360 kg đường. Ngày đầu bán 2/9 số đường, ngày thứ hai bán 3/7 số đường còn lại.", "de": "Sau hai ngày cửa hàng còn lại bao nhiêu kg đường?", "diem": 1.0, "loai": "so", "dap": 160, "hoi": "Số kg", "dv": "", "giai": [["Còn lại 360 − 80 = 280 (kg); ngày thứ hai bán 280 · 3/7 = 120 (kg).", 0.5], ["Sau hai ngày còn 280 − 120 = 160 (kg).", 0.5]], "loi": "Tính 3/7 của 360 thay vì của số còn lại.", "tu": "", "tu_diem": 0}, {"bai": 4, "nhan": "", "muc": "Vận dụng cao", "chung": "", "de": "Một bạn đọc sách trong 3 ngày: ngày 1 đọc 1/3 số trang, ngày 2 đọc 1/2 số trang còn lại, ngày 3 đọc nốt 50 trang. Cuốn sách có bao nhiêu trang?", "diem": 1.0, "loai": "so", "dap": 150, "hoi": "Số trang", "dv": "", "giai": [["Sau ngày 1 còn 2/3 cuốn; ngày 2 đọc 1/2 · 2/3 = 1/3 cuốn.", 0.25], ["Ngày 3 đọc 1 − 1/3 − 1/3 = 1/3 cuốn.", 0.25], ["Số trang: 50 : 1/3 = 150 (trang).", 0.5]], "loi": "Coi ngày 2 đọc 1/2 cả cuốn.", "tu": "", "tu_diem": 0}]}, {"so": 19, "loai": "vn", "ten": "Ôn tập chương VI – Phân số", "phut": 45, "ds": [{"de": "Mỗi khẳng định sau đúng hay sai?", "y": [["−9/12 = 3/−4", true, "(−9) · (−4) = 12 · 3 = 36"], ["3/4 < 2/3", false, "9/12 > 8/12"], ["1/4 + 1/5 = 2/9", false, "bằng 9/20"], ["−2/5 : 2/5 = −1", true, "−2/5 · 5/2 = −1"]]}, {"de": "Mỗi khẳng định sau đúng hay sai?", "y": [["14/35 là phân số tối giản", false, "rút gọn được thành 2/5"], ["Hỗn số 2 1/4 bằng 9/4", true, "(2 · 4 + 1)/4 = 9/4"], ["2/7 của 35 bằng 10", true, "35 · 2/7 = 10"], ["Số nghịch đảo của −5 là 5", false, "là −1/5"]]}], "tl": [{"bai": 1, "nhan": "a", "muc": "Biết", "chung": "", "de": "Rút gọn −30/72 đến tối giản (mẫu dương). Mẫu số của kết quả là bao nhiêu?", "diem": 1.0, "loai": "so", "dap": 12, "hoi": "Mẫu số", "dv": "", "giai": [["ƯCLN(30, 72) = 6", 0.5], ["−30/72 = −5/12 nên mẫu số là 12.", 0.5]], "loi": "Rút gọn chưa hết, ghi 36 hoặc 24.", "tu": "", "tu_diem": 0}, {"bai": 1, "nhan": "b", "muc": "Biết", "chung": "", "de": "Tính 7/10 + −1/4, viết kết quả tối giản. Tử số là bao nhiêu?", "diem": 1.0, "loai": "so", "dap": 9, "hoi": "Tử số", "dv": "", "giai": [["7/10 + −1/4 = 14/20 + −5/20", 0.5], ["= 9/20 nên tử số là 9.", 0.5]], "loi": "Cộng tử với tử, mẫu với mẫu.", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "a", "muc": "Hiểu", "chung": "", "de": "Tính −6/7 · 14/9, viết kết quả tối giản có mẫu dương. Tử số là bao nhiêu?", "diem": 1.0, "loai": "so", "dap": -4, "hoi": "Tử số", "dv": "", "giai": [["−6/7 · 14/9 = −84/63", 0.5], ["= −4/3 nên tử số là −4.", 0.5]], "loi": "Quên dấu trừ.", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "b", "muc": "Hiểu", "chung": "", "de": "Tính hợp lí 5/11 · 4/7 + 5/11 · 3/7 + 6/11. Kết quả là số nào?", "diem": 1.0, "loai": "so", "dap": 1, "hoi": "Kết quả", "dv": "", "giai": [["= 5/11 · (4/7 + 3/7) + 6/11 = 5/11 + 6/11", 0.5], ["= 1.", 0.5]], "loi": "Tính từng tích, quy đồng sai.", "tu": "", "tu_diem": 0}, {"bai": 2, "nhan": "c", "muc": "Hiểu", "chung": "", "de": "Tìm x, biết x − 3/4 = 9/4.", "diem": 1.0, "loai": "so", "dap": 3, "hoi": "x =", "dv": "", "giai": [["x = 9/4 + 3/4 = 12/4", 0.5], ["= 3.", 0.5]], "loi": "Lấy 9/4 − 3/4.", "tu": "", "tu_diem": 0}, {"bai": 3, "nhan": "a", "muc": "Vận dụng", "chung": "Lớp 6B có 36 HS. Số HS thích bóng đá chiếm 4/9 số HS cả lớp; số HS thích cầu lông b   if(thieu.length && !confirm("Em còn bỏ trống: "+thieu.join(", ")+". Vẫn nộp bài?")) return;
  let tong=0, p1=0, p2=0, sai=[], kq=[];
  b.ds.forEach((c,i)=>{ if(!coLam("ds",i)) return; const r=chamDS(c,st.ds[i]); p1+=r.d; if(r.k<4) sai.push("Câu "+(i+1)); kq.push({loai:"ds",i,r}); });
  b.tl.forEach((c,i)=>{ if(!coLam("tl",i)) return; const d=chamTL(c,st.tl[i],st.tu[i]); p2+=d; if(d<c.diem) sai.push(tenY(c)); kq.push({loai:"tl",i,d}); });
  tong = p1+p2;
  const dd = doc();
  dd.ls.push({ngay:new Date().toLocaleDateString("vi-VN"), bai:idB(b), diem:tong, sai, lai:!!st.chi});
  if(SO_DIEM && b.loai==="vn"){ dd.cho = dd.cho || [];
    dd.cho.push({id:st.ma+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,6), ma:st.ma, lop:st.lop, buoi:b.so, lai:!!st.chi, diem:tong, p1, p2, sai:sai.join(", ")}); }
  ghi(dd);
  veKQ(tong,p1,p2,sai,kq);
  if(SO_DIEM) guiSo();
}
// Gửi các kết quả còn chờ về sổ điểm; mất mạng thì giữ lại, lần sau mở app tự gửi tiếp.
function guiSo(){
  const cho = doc().cho || [], tt = () => $("#tt-gui");
  if(!SO_DIEM || !cho.length) return;
  if(tt()) tt().textContent = "Đang gửi điểm về sổ của thầy…";
  Promise.all(cho.map(r => fetch(SO_DIEM, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(r)})
    .then(()=>r.id, ()=>null))).then(ok => {
    const d = doc(); d.cho = (d.cho||[]).filter(r => !ok.includes(r.id)); ghi(d);
    if(tt()) tt().textContent = d.cho.length ? "⚠️ Chưa gửi được điểm (mất mạng?). Lần sau em mở app khi có mạng, app tự gửi lại." : "✅ Đã gửi điểm về sổ của thầy.";
  });
}
function veKQ(tong,p1,p2,sai,kq){
  const b = st.bai;
  let h = `<div class="the"><div class="nho" style="text-align:center">Mã ${esc(st.ma)} · Lớp ${esc(st.lop)} · ${nhanB(b)}${st.chi?" (làm lại)":""}</div>
   <p class="kq-diem">${so(tong)}${st.chi?"":" / 10"}</p>
   <div class="muc"><div>Phần I (Đúng – Sai): <b>${so(p1)}</b></div><div>Phần II (tự luận): <b>${so(p2)}</b></div></div>
   ${SO_DIEM?`<p class="nho" id="tt-gui" style="text-align:center"></p>`:""}
   <p class="nho">${sai.length?"Câu chưa đúng: "+esc(sai.join(", "))+". Đọc lời nhắc, đối chiếu lời giải mẫu, sửa vào vở bằng bút màu.":"Tuyệt vời! Em làm đúng hết. Đối chiếu lời giải mẫu để chắc phần trình bày được điểm tối đa."}</p></div>`;
  kq.forEach(x=>{
    if(x.loai==="ds"){ const c=b.ds[x.i], tl=st.ds[x.i], cls=x.r.k===4?"d":(x.r.k>=2?"m":"s");
      h += `<div class="the kq ${cls}"><span class="tag">Câu ${x.i+1} · đúng ${x.r.k}/4 ý · ${so(x.r.d)} đ</span><div class="de">${m(c.de)}</div>`;
      c.y.forEach((y,j)=>{ const ok = tl[j]===y[1];
        h += `<div class="yk">${ok?"✅":"❌"} ${"abcd"[j]}) ${m(y[0])} — <b>${y[1]?"Đúng":"Sai"}</b>${ok?"":` <span class="nho">(em chọn ${tl[j]===null?"—":(tl[j]?"Đúng":"Sai")})</span>`}<br><span class="nho">Vì: ${m(y[2])}</span></div>`; });
      h += `</div>`;
    } else { const c=b.tl[x.i], ok = x.d>=c.diem, cls = ok?"d":(x.d>0?"m":"s");
      h += `<div class="the kq ${cls}"><span class="tag">${tenY(c)} · ${so(x.d)}/${so(c.diem)} đ</span>
        <div class="de">${c.chung?m(c.chung)+" ":""}${m(c.de)}</div>
        <div class="nho">Em ghi: <b>${esc(st.tl[x.i]||"(bỏ trống)")}</b> · Đáp số: <b>${esc(dapAn(c))}</b></div>`;
      if(!ok) h += `<div class="nhac"><b>Chú ý chỗ hay sai:</b> ${m(c.loi)}</div>`;
      h += `<details ${ok?"":"open"}><summary>Lời giải trình bày mẫu và biểu điểm</summary><div class="giai"><table>`;
      c.giai.forEach(g=>{ h += `<tr><td>${m(g[0])}</td><td>${so(g[1])} đ</td></tr>`; });
      h += `</table></div></details></div>`;
    } });
  h += `<div class="hang">${sai.length?`<button class="chinh" onclick="lamLai()">Làm lại câu sai</button>`:""}
    <button onclick="chep(${tong},'${esc(sai.join(", "))}')">Chép kết quả gửi thầy</button></div>`;
  $("#app").innerHTML = h;
  $("#dh").innerHTML = `<button onclick="trangDau()">Về trang đầu</button>`;
  st._kq = kq; window.scrollTo(0,0);
}
function lamLai(){
  const b = st.bai, ds=[], tl=[];
  st._kq.forEach(x=>{ if(x.loai==="ds" && x.r.k<4) ds.push(x.i); if(x.loai==="tl" && x.d<b.tl[x.i].diem) tl.push(x.i); });
  batDau(idB(b), {ds, tl});
}
function chep(t, sai){
  const s = `Ôn tập Toán 6 · ${nhanB(st.bai)}${st.chi?" (làm lại)":""} · Mã ${st.ma} · Lớp ${st.lop} · Điểm app: ${so(t)} · Câu sai: ${sai||"không"} · ${new Date().toLocaleString("vi-VN")}`;
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(()=>alert("Đã chép. Mở Zalo, dán vào nhóm lớp gửi thầy."), ()=>prompt("Chép dòng này:", s));
  else prompt("Chép dòng này:", s);
}
(function(){ const u = new URLSearchParams(location.search), d=doc(); trangDau();
  const n = u.get("vn") || u.get("bai"), q = n ? "V"+n : null;   // app chỉ còn bài về nhà; link cũ ?bai=n mở bài về nhà buổi n
  if(q && d.ma && DATA.find(b=>String(idB(b))===q)){ st.ma=d.ma; st.lop=d.lop||""; batDau(q); }
  guiSo(); })();
</script></body></html>
